<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>破冰协议 Icebreaker Protocol</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; }

  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+SC:wght@400;600;800&display=swap');

  body {
    font-family: 'Noto Sans SC', 'Inter', sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    height: 100%;
    overflow: hidden;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .ice-bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(56, 189, 248, 0.07) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(56, 189, 248, 0.03) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* ==================== Landing ==================== */
  #landing {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 2rem;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  #landing.hidden {
    opacity: 0;
    transform: translateY(-30px);
    pointer-events: none;
  }

  .tag {
    display: inline-block;
    padding: 0.25rem 0.9rem;
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.2);
    border-radius: 20px;
    font-size: 0.75rem;
    color: #38bdf8;
    margin-bottom: 1.5rem;
  }

  .landing-title {
    font-size: 3.2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 0.8rem;
  }
  .landing-title .ice { color: #38bdf8; }

  .landing-sub {
    font-size: 1.15rem;
    color: #666;
    margin-bottom: 3rem;
    line-height: 1.7;
    max-width: 400px;
  }

  .landing-input-wrap {
    width: 100%;
    max-width: 520px;
    position: relative;
  }
  .landing-input-wrap input {
    width: 100%;
    padding: 1.2rem 1.5rem;
    font-size: 1.1rem;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(56,189,248,0.25);
    border-radius: 16px;
    color: #e0e0e0;
    font-family: inherit;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .landing-input-wrap input:focus {
    border-color: rgba(56,189,248,0.5);
    box-shadow: 0 0 0 4px rgba(56,189,248,0.08);
  }
  .landing-input-wrap input::placeholder {
    color: #444;
  }
  .landing-hint {
    margin-top: 1.2rem;
    font-size: 0.82rem;
    color: #333;
  }
  .landing-hint kbd {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    font-size: 0.75rem;
    font-family: inherit;
    color: #555;
  }

  /* ==================== Chat 全屏 ==================== */
  #chatScreen {
    display: none;
    flex-direction: column;
    height: 100%;
    position: relative;
    z-index: 10;
  }
  #chatScreen.active { display: flex; }

  .chat-header {
    flex-shrink: 0;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .chat-header-title {
    font-size: 1rem;
    font-weight: 600;
    color: #38bdf8;
  }
  .chat-header-sub {
    font-size: 0.78rem;
    color: #555;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    scroll-behavior: smooth;
  }

  /* ---- 消息气泡 ---- */
  .msg {
    max-width: 80%;
    animation: fadeIn 0.35s ease;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    padding: 0.8rem 1.1rem;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    color: #fff;
    border-radius: 16px 16px 4px 16px;
    font-size: 0.95rem;
    line-height: 1.6;
  }
  .msg.assistant {
    align-self: flex-start;
    padding: 0.8rem 1.1rem;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07);
    color: #ddd;
    border-radius: 16px 16px 16px 4px;
    font-size: 0.95rem;
    line-height: 1.6;
  }
  .msg.system {
    align-self: center;
    padding: 0.5rem 1rem;
    background: rgba(56,189,248,0.06);
    border: 1px solid rgba(56,189,248,0.12);
    border-radius: 20px;
    color: #38bdf8;
    font-size: 0.8rem;
    text-align: center;
  }
  .msg.typing {
    align-self: flex-start;
    padding: 0.6rem 1rem;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 16px;
    color: #555;
    font-size: 0.85rem;
  }

  /* ---- 特殊卡片 ---- */
  .msg.card {
    max-width: 85%;
    align-self: flex-start;
    padding: 0;
    background: none;
    border: none;
    animation: slideUp 0.4s ease;
  }

  .card-contract {
    background: rgba(56, 189, 248, 0.04);
    border: 1px solid rgba(56, 189, 248, 0.15);
    border-radius: 16px;
    padding: 1.5rem;
  }
  .card-contract h3 {
    font-size: 1.1rem;
    color: #38bdf8;
    margin-bottom: 1rem;
    font-weight: 700;
  }
  .card-contract ul {
    list-style: none;
    padding: 0;
    margin-bottom: 1.2rem;
  }
  .card-contract li {
    padding: 0.35rem 0;
    font-size: 0.9rem;
    color: #bbb;
    line-height: 1.6;
  }
  .card-contract li::before {
    content: "\2611 ";
    margin-right: 0.5rem;
    color: #38bdf8;
  }
  .card-contract .card-forbidden {
    color: #f87171;
    font-weight: 600;
    margin-top: 0.6rem;
    padding-top: 0.6rem;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .card-contract .card-forbidden::before {
    content: "\2716 ";
    color: #f87171;
    margin-right: 0.5rem;
  }
  .card-contract-actions {
    display: flex;
    gap: 0.6rem;
  }
  .card-contract-actions button {
    flex: 1;
    padding: 0.7rem;
    font-size: 0.9rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .card-accept {
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    color: #fff;
  }
  .card-accept:hover {
    box-shadow: 0 4px 16px rgba(56,189,248,0.3);
  }
  .card-question {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: #aaa;
  }
  .card-question:hover {
    background: rgba(255,255,255,0.08);
    color: #ddd;
  }

  .card-instruction {
    background: rgba(99, 102, 241, 0.06);
    border: 1.5px solid rgba(99, 102, 241, 0.2);
    border-radius: 16px;
    padding: 1.5rem;
  }
  .card-instruction .ci-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #6366f1;
    font-weight: 700;
    margin-bottom: 0.8rem;
  }
  .card-instruction .ci-text {
    font-size: 1.05rem;
    line-height: 1.8;
    color: #ddd;
  }
  .card-instruction .ci-task {
    margin-top: 1rem;
    padding-top: 0.8rem;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 0.85rem;
    color: #888;
  }
  .card-instruction .ci-task strong {
    color: #38bdf8;
  }

  /* ---- Timer ---- */
  .card-timer {
    background: rgba(56,189,248,0.03);
    border: 1px solid rgba(56,189,248,0.12);
    border-radius: 16px;
    padding: 1.5rem;
    text-align: center;
  }
  .card-timer .ct-label {
    font-size: 0.82rem;
    color: #666;
    margin-bottom: 0.5rem;
    animation: pulse 2s infinite;
  }
  .card-timer .ct-display {
    font-size: 4rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #38bdf8;
    letter-spacing: 0.04em;
    line-height: 1;
    margin: 0.5rem 0;
  }
  .card-timer .ct-bar {
    width: 100%;
    height: 5px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    margin: 0.8rem 0;
    overflow: hidden;
  }
  .card-timer .ct-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #38bdf8, #6366f1);
    border-radius: 3px;
    transition: width 1s linear;
  }
  .card-timer-actions {
    display: flex;
    gap: 0.6rem;
    margin-top: 1rem;
  }
  .card-timer-actions button {
    flex: 1;
    padding: 0.65rem;
    font-size: 0.88rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .ct-done {
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    color: #fff;
  }
  .ct-done:hover { box-shadow: 0 4px 16px rgba(56,189,248,0.3); }
  .ct-skip {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08) !important;
    color: #888;
  }
  .ct-skip:hover { background: rgba(255,255,255,0.08); color: #bbb; }

  /* ---- Done ---- */
  .card-done {
    text-align: center;
    padding: 2rem 1.5rem;
    background: rgba(52, 211, 153, 0.04);
    border: 1px solid rgba(52, 211, 153, 0.15);
    border-radius: 16px;
  }
  .card-done .cd-icon {
    font-size: 2.5rem;
    margin-bottom: 0.8rem;
  }
  .card-done .cd-title {
    font-size: 1.5rem;
    font-weight: 800;
    color: #34d399;
    margin-bottom: 0.5rem;
  }
  .card-done .cd-text {
    font-size: 0.92rem;
    color: #888;
    line-height: 1.7;
    margin-bottom: 1.2rem;
  }
  .card-done-actions {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
  }
  .card-done-actions button {
    padding: 0.65rem 1.5rem;
    font-size: 0.88rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }

  /* ---- Roadmap ---- */
  .card-roadmap {
    background: rgba(99, 102, 241, 0.04);
    border: 1px solid rgba(99, 102, 241, 0.15);
    border-radius: 16px;
    padding: 1.5rem;
  }
  .card-roadmap .cr-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1.2rem;
  }
  .card-roadmap .cr-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: #38bdf8;
  }
  .card-roadmap .cr-task {
    font-size: 0.82rem;
    color: #666;
    padding: 0.2rem 0.6rem;
    background: rgba(56,189,248,0.08);
    border-radius: 8px;
  }
  .card-roadmap .cr-steps {
    list-style: none;
    padding: 0;
    margin-bottom: 1.2rem;
  }
  .card-roadmap .cr-step {
    display: flex;
    gap: 0.8rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 0.9rem;
    color: #888;
    line-height: 1.5;
  }
  .card-roadmap .cr-step:last-child { border-bottom: none; }
  .card-roadmap .cr-step-num {
    flex-shrink: 0;
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: #666;
  }
  .card-roadmap .cr-step.active .cr-step-num {
    background: rgba(56,189,248,0.15);
    border-color: #38bdf8;
    color: #38bdf8;
  }
  .card-roadmap .cr-step.active {
    color: #ddd;
  }
  .card-roadmap .cr-step.done .cr-step-num {
    background: rgba(52,211,153,0.15);
    border-color: #34d399;
    color: #34d399;
  }
  .card-roadmap .cr-step.done {
    color: #666;
    text-decoration: line-through;
    text-decoration-color: rgba(255,255,255,0.1);
  }
  .card-roadmap .cr-bar {
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    margin-bottom: 1rem;
    overflow: hidden;
  }
  .card-roadmap .cr-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #38bdf8, #6366f1);
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  /* ---- Step ---- */
  .card-step {
    background: rgba(99, 102, 241, 0.06);
    border: 1.5px solid rgba(99, 102, 241, 0.2);
    border-radius: 16px;
    padding: 1.5rem;
  }
  .card-step .cs-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.8rem;
  }
  .card-step .cs-badge {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #6366f1;
    font-weight: 700;
    padding: 0.2rem 0.6rem;
    background: rgba(99,102,241,0.1);
    border-radius: 6px;
  }
  .card-step .cs-progress {
    font-size: 0.78rem;
    color: #555;
  }
  .card-step .cs-text {
    font-size: 1.05rem;
    line-height: 1.8;
    color: #ddd;
  }
  .card-step .cs-task {
    margin-top: 1rem;
    padding-top: 0.8rem;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 0.85rem;
    color: #888;
  }
  .card-step .cs-task strong { color: #38bdf8; }
  .card-step-actions {
    display: flex;
    gap: 0.6rem;
    margin-top: 1rem;
  }
  .card-step-actions button {
    flex: 1;
    padding: 0.65rem;
    font-size: 0.88rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }

  /* ---- Log ---- */
  .card-log {
    background: rgba(255,255,255,0.02);
    border: 1px dashed rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 1.2rem;
    font-size: 0.85rem;
    line-height: 2;
    color: #888;
  }
  .card-log .cl-title {
    color: #38bdf8;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }

  /* ==================== 输入栏 ==================== */
  .chat-input-bar {
    flex-shrink: 0;
    padding: 0.8rem 1.5rem 1.2rem 1.5rem;
    border-top: 1px solid rgba(255,255,255,0.04);
    background: rgba(10,10,15,0.95);
  }
  .chat-input-inner {
    display: flex;
    gap: 0.6rem;
    max-width: 800px;
    margin: 0 auto;
  }
  .chat-input-inner input {
    flex: 1;
    padding: 0.85rem 1.1rem;
    font-size: 0.95rem;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(56,189,248,0.2);
    border-radius: 12px;
    color: #e0e0e0;
    font-family: inherit;
    outline: none;
    transition: border-color 0.3s;
  }
  .chat-input-inner input:focus {
    border-color: rgba(56,189,248,0.45);
  }
  .chat-input-inner input:disabled { opacity: 0.4; }
  .chat-input-inner input::placeholder { color: #444; }
  .chat-input-inner button {
    padding: 0.85rem 1.4rem;
    font-size: 0.95rem;
    font-weight: 600;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .chat-input-inner button:hover {
    box-shadow: 0 4px 16px rgba(56,189,248,0.3);
  }
  .chat-input-inner button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }

  .watermark {
    position: fixed;
    bottom: 0.8rem;
    right: 1rem;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.1);
    z-index: 5;
  }

  @media (max-width: 480px) {
    .landing-title { font-size: 2.2rem; }
    .landing-sub { font-size: 1rem; }
    .chat-messages { padding: 1rem; }
    .msg { max-width: 90%; }
    .msg.card { max-width: 95%; }
    .card-timer .ct-display { font-size: 3rem; }
  }
</style>
</head>
<body>

<div class="ice-bg"></div>

<!-- ==================== Landing ==================== -->
<div id="landing">
  <div class="tag">Claude Code Skill</div>
  <h1 class="landing-title"><span class="ice">破冰</span>协议</h1>
  <p class="landing-sub">
    你不是懒。你只是启动阈值太高了。<br>
    说一句你想做的事，AI 会帮你拆解并带你做出雏形。
  </p>
  <div class="landing-input-wrap">
    <input type="text" id="landingInput" placeholder="比如：我想写一篇博客但不知道怎么开头..."
      onkeydown="if(event.key==='Enter') startProtocol()" autofocus>
  </div>
  <p class="landing-hint">按 <kbd>Enter</kbd> 开始</p>
</div>

<!-- ==================== Chat ==================== -->
<div id="chatScreen">
  <div class="chat-header">
    <div class="chat-header-title">破冰协议</div>
    <div class="chat-header-sub" id="chatHeaderSub">AI 引导中</div>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-bar">
    <div class="chat-input-inner">
      <input type="text" id="chatInput" placeholder="说点什么..."
        onkeydown="if(event.key==='Enter' && !event.shiftKey) sendChat()">
      <button id="chatSendBtn" onclick="sendChat()">发送</button>
    </div>
  </div>
</div>

<div class="watermark">icebreaker-protocol</div>

<script>
// ==================== 状态 ====================
let chatHistory = [];
let currentTask = '';
let isChatting = false;
let timerInterval = null;
let totalSteps = 0;
let currentStep = 0;

// ==================== Landing ====================
function startProtocol() {
  const input = document.getElementById('landingInput');
  const message = input.value.trim();
  if (!message) {
    input.style.borderColor = 'rgba(248,113,113,0.6)';
    input.setAttribute('placeholder', '随便写点什么，不许空白');
    return;
  }
  input.value = '';

  // 切换到聊天界面
  document.getElementById('landing').classList.add('hidden');
  const cs = document.getElementById('chatScreen');
  cs.classList.add('active');

  setTimeout(() => document.getElementById('chatInput').focus(), 300);

  sendToAI(message);
}

// ==================== 消息渲染 ====================
function scrollChat() {
  const c = document.getElementById('chatMessages');
  c.scrollTop = c.scrollHeight;
}

function addTextMsg(role, content) {
  const c = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = content;
  c.appendChild(div);
  scrollChat();
  return div;
}

function addCard(html) {
  const c = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg card';
  div.innerHTML = html;
  c.appendChild(div);
  scrollChat();
  return div;
}

// ---- 契约卡片 ----
function showContract() {
  const html = `
    <div class="card-contract">
      <h3>破冰契约</h3>
      <ul>
        <li>目标：从 0 到 1，拿到一个可以改的初稿</li>
        <li>初稿不需要完美，但要有东西可以迭代</li>
        <li>第一步足够小，小到不需要勇气就能迈出去</li>
        <li>允许自己不满意初稿——初稿就是用来改的</li>
        <li class="card-forbidden">唯一不允许：什么都不产出。白纸什么都改不了。</li>
      </ul>
      <div class="card-contract-actions">
        <button class="card-accept" onclick="acceptContract()">同意，开始</button>
        <button class="card-question" onclick="questionContract()">我有顾虑</button>
      </div>
    </div>`;
  addCard(html);
}

function acceptContract() {
  sendToAI('我同意契约');
}

function questionContract() {
  const q = '我不想做一份随便应付的东西';
  document.getElementById('chatInput').value = q;
  sendChat();
}

// ---- 路线图卡片 ----
function showRoadmap(taskName, steps, replyText) {
  totalSteps = steps.length;
  currentStep = 0;

  // 先显示 AI 的拆解说明文字
  if (replyText) addTextMsg('assistant', replyText);
  chatHistory.push({ role: 'assistant', content: replyText });

  const stepsHtml = steps.map((s, i) => `
    <div class="cr-step${i === 0 ? ' active' : ''}" id="roadmapStep${i}">
      <div class="cr-step-num">${i + 1}</div>
      <div>${s}</div>
    </div>
  `).join('');

  const html = `
    <div class="card-roadmap">
      <div class="cr-header">
        <div class="cr-title">拆解路线图</div>
        ${taskName ? `<div class="cr-task">${taskName}</div>` : ''}
      </div>
      <div class="cr-bar"><div class="cr-bar-fill" id="roadmapBar" style="width:0%"></div></div>
      <div class="cr-steps">${stepsHtml}</div>
    </div>`;
  addCard(html);
}

function updateRoadmapProgress(step) {
  for (let i = 0; i < totalSteps; i++) {
    const el = document.getElementById('roadmapStep' + i);
    if (!el) continue;
    el.classList.remove('active', 'done');
    if (i < step) el.classList.add('done');
    if (i === step) el.classList.add('active');
  }
  const bar = document.getElementById('roadmapBar');
  if (bar) bar.style.width = (step / totalSteps * 100) + '%';
}

// ---- 步骤卡片 ----
function showStep(stepNum, total, replyText, taskName) {
  currentStep = stepNum;

  // 更新路线图进度
  updateRoadmapProgress(stepNum - 1);

  const html = `
    <div class="card-step">
      <div class="cs-header">
        <div class="cs-badge">第 ${stepNum} 步</div>
        <div class="cs-progress">${stepNum} / ${total}</div>
      </div>
      <div class="cs-text">${replyText || '执行当前步骤'}</div>
      ${taskName ? `<div class="cs-task">任务：<strong>"${taskName}"</strong></div>` : ''}
      <div class="card-step-actions">
        <button class="card-accept" onclick="sendToAI('我做完了这一步')">做完了</button>
        <button class="card-question" onclick="sendToAI('这一步我不太懂，能再说明一下吗？')">需要帮助</button>
      </div>
    </div>`;
  addCard(html);
}

// ---- 倒计时卡片 ----
function showTimer(seconds) {
  const html = `
    <div class="card-timer" id="timerCard">
      <div class="ct-label">思考预算倒计时</div>
      <div class="ct-display" id="timerDisplay">${formatTime(seconds)}</div>
      <div class="ct-bar"><div class="ct-bar-fill" id="timerBar" style="width:100%"></div></div>
      <div class="card-timer-actions">
        <button class="ct-done" onclick="onTimerDone()">我做完了</button>
        <button class="ct-skip" onclick="onTimerSkip()">跳过</button>
      </div>
    </div>`;
  addCard(html);
  startTimer(seconds);
}

// ---- 完成卡片 ----
function showDone() {
  // 更新路线图到全部完成
  if (totalSteps > 0) {
    for (let i = 0; i < totalSteps; i++) {
      const el = document.getElementById('roadmapStep' + i);
      if (el) { el.classList.remove('active'); el.classList.add('done'); }
    }
    const bar = document.getElementById('roadmapBar');
    if (bar) bar.style.width = '100%';
  }

  const html = `
    <div class="card-done">
      <div class="cd-icon">&#187;&#187;&#187;</div>
      <div class="cd-title">雏形完成</div>
      <div class="cd-text">你把一个大任务拆开，一块一块做出了完整的东西。现在你有了一个可以改的初版。</div>
      <div class="card-done-actions">
        <button class="card-accept" onclick="sendToAI('帮我看看哪里可以改进')">继续改进</button>
        <button class="card-question" onclick="showLogCard()">生成日志</button>
      </div>
    </div>`;
  addCard(html);
}

// ---- 日志卡片 ----
function showLogCard() {
  const today = new Date().toLocaleDateString('zh-CN');
  const task = currentTask || '未记录';
  const html = `
    <div class="card-log">
      <div class="cl-title">【破冰日志】</div>
      日期：${today}<br>
      本轮任务：${task}<br>
      完成情况：☐ 仅完成第一步 &nbsp; ☐ 超预期完成<br>
      明日预设：________________<br>
      连续破冰：____ 天
    </div>`;
  addCard(html);
}

// ==================== 聊天核心 ====================
function sendChat() {
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if (!message || isChatting) return;
  input.value = '';
  sendToAI(message);
}

async function sendToAI(message) {
  const input = document.getElementById('chatInput');
  const btn = document.getElementById('chatSendBtn');

  addTextMsg('user', message);
  chatHistory.push({ role: 'user', content: message });

  input.disabled = true;
  btn.disabled = true;
  isChatting = true;

  const typingEl = addTextMsg('typing', '思考中...');

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: message,
        history: chatHistory.slice(0, -1)
      })
    });

    if (!response.ok) throw new Error('请求失败');

    const data = await response.json();
    typingEl.remove();

    let reply = data.reply;

    // 提取标记
    const screenMatch = reply.match(/\[SCREEN:(\w+)\]\s*$/);
    const taskMatch = reply.match(/\[TASK:(.+?)\]/);
    const stepsMatch = reply.match(/\[STEPS:(\d+)\]/);
    const stepMatch = reply.match(/\[STEP:(\d+)\/(\d+)\]/);

    // 清理标记
    reply = reply
      .replace(/\[SCREEN:\w+\]\s*$/, '')
      .replace(/\[TASK:.+?\]/g, '')
      .replace(/\[STEPS:\d+\]/g, '')
      .replace(/\[STEP:\d+\/\d+\]/g, '')
      .trim();

    if (taskMatch) currentTask = taskMatch[1].trim();

    if (screenMatch) {
      const target = screenMatch[1];

      if (target === 'contract') {
        if (reply) addTextMsg('assistant', reply);
        chatHistory.push({ role: 'assistant', content: reply });
        showContract();

      } else if (target === 'roadmap') {
        // 从回复中提取步骤列表（匹配 "1. xxx" 或 "1、xxx" 格式）
        const stepLines = reply.match(/^\s*\d+[.、]\s*.+$/gm) || [];
        const steps = stepLines.map(s => s.replace(/^\s*\d+[.、]\s*/, '').trim());
        // 移除步骤行，保留说明文字
        const introText = reply.replace(/^\s*\d+[.、]\s*.+$/gm, '').trim();
        showRoadmap(currentTask, steps, introText || reply);

      } else if (target === 'step') {
        const stepNum = stepMatch ? parseInt(stepMatch[1]) : currentStep + 1;
        const stepTotal = stepMatch ? parseInt(stepMatch[2]) : totalSteps;
        showStep(stepNum, stepTotal, reply, currentTask);
        chatHistory.push({ role: 'assistant', content: reply });

      } else if (target === 'done') {
        if (reply) addTextMsg('assistant', reply);
        chatHistory.push({ role: 'assistant', content: reply });
        showDone();
      }
    } else {
      if (reply) {
        addTextMsg('assistant', reply);
        chatHistory.push({ role: 'assistant', content: reply });
      }
    }

  } catch (err) {
    typingEl.remove();
    addTextMsg('system', '出错了，请重试。(' + err.message + ')');
  } finally {
    input.disabled = false;
    btn.disabled = false;
    isChatting = false;
    input.focus();
  }
}

// ==================== 倒计时 ====================
function startTimer(seconds) {
  let remaining = seconds;
  const display = document.getElementById('timerDisplay');
  const bar = document.getElementById('timerBar');
  if (!display || !bar) return;

  display.textContent = formatTime(remaining);
  bar.style.width = '100%';

  timerInterval = setInterval(() => {
    remaining--;
    display.textContent = formatTime(remaining);
    bar.style.width = (remaining / seconds * 100) + '%';

    if (remaining <= 5) {
      display.style.color = '#f87171';
      playTick();
    }

    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      display.textContent = "00:00";
      display.style.color = '#38bdf8';
      playBeep();
      setTimeout(() => sendToAI('倒计时结束了'), 1200);
    }
  }, 1000);
}

function onTimerDone() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  sendToAI('我做完了');
}

function onTimerSkip() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  sendToAI('我跳过了倒计时');
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

// ==================== 音效 ====================
function playBeep() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  function beep(freq, start, dur) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.4, ctx.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + start + dur);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + dur);
  }
  beep(880, 0, 0.15);
  beep(880, 0.25, 0.15);
  beep(1100, 0.5, 0.3);
}

function playTick() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.value = 600;
  osc.type = 'sine';
  gain.gain.setValueAtTime(0.15, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
  osc.start();
  osc.stop(ctx.currentTime + 0.08);
}
</script>

[project]
name = "icebreaker-protocol"
version = "2.0.0"
description = "AI-guided icebreaker protocol for turning perfectionist hesitation into a visible first draft."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "openai>=1.12.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.11.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.0",
    "python-pptx>=1.0.2",
    "uvicorn>=0.29.0",
]

[project.scripts]
icebreaker-demo = "main:main"
